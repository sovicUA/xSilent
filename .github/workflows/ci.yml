name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify generated files are up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib/database lib/l10n \
            || (echo "::error::Згенеровані файли застаріли — запусти build_runner / gen-l10n і закоміть." && exit 1)
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Без секретів підпису — збірка падає на debug-ключ (перевірка компіляції).
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
