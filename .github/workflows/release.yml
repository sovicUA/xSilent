name: Release

# Тег виду v1.2.3 → підписаний AAB → трек "internal" у Google Play + GitHub Release.
# Перед тегуванням підняти version у pubspec.yaml (напр. 1.0.1+2) — інакше Play
# відхилить дублікат versionCode.
#
# Потрібні секрети репозиторію:
#   KEYSTORE_BASE64          — base64 від android/app/upload-keystore.jks
#   KEYSTORE_PASSWORD        — storePassword
#   KEY_PASSWORD             — keyPassword
#   KEY_ALIAS               — keyAlias (напр. upload)
#   PLAY_SERVICE_ACCOUNT_JSON — JSON сервісного акаунта з доступом до застосунку
#
# Перший AAB має бути завантажений у Play Console вручну (див. store/README.md).

on:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # створення GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter build appbundle --release

      - name: Publish to Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ua.org.sovic.xsilent
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Cleanup secrets
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
